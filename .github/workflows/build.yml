
name: Build Lexoria APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Lexoria_Android_Project_Fixed.zip'
      - 'Lexoria_Android_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack corrected Lexoria project
        run: unzip -o Lexoria_Android_Project_Fixed.zip -d .

      - name: Verify Java and Kotlin targets
        run: |
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' LexoriaAndroid/app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' LexoriaAndroid/app/build.gradle.kts
          grep -q 'jvmTarget = "17"' LexoriaAndroid/app/build.gradle.kts

      - name: Build Android APK
        run: gradle -p LexoriaAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Lexoria-debug-APK
          path: LexoriaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
